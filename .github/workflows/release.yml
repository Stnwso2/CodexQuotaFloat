name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 9.0.x

      - name: Publish self-contained application
        run: dotnet publish --configuration Release --runtime win-x64 --self-contained true --output publish

      - name: Package release and checksum
        id: package
        shell: pwsh
        run: |
          $packageName = "CodexQuotaFloat-${{ github.ref_name }}-win-x64"
          $packageDirectory = Join-Path $PWD "artifacts/$packageName"
          New-Item -ItemType Directory -Path $packageDirectory -Force | Out-Null
          Copy-Item publish/CodexQuotaFloat.exe, install.ps1, uninstall.ps1, README.md, LICENSE -Destination $packageDirectory

          $zipPath = Join-Path $PWD "artifacts/$packageName.zip"
          Compress-Archive -Path "$packageDirectory/*" -DestinationPath $zipPath -CompressionLevel Optimal
          $checksumPath = "$zipPath.sha256"
          $hash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $packageName.zip" | Set-Content -LiteralPath $checksumPath -Encoding ascii

          "zip_path=$zipPath" >> $env:GITHUB_OUTPUT
          "checksum_path=$checksumPath" >> $env:GITHUB_OUTPUT

      - name: Attest release provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4
        with:
          subject-path: ${{ steps.package.outputs.zip_path }}

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_PATH: ${{ steps.package.outputs.zip_path }}
          CHECKSUM_PATH: ${{ steps.package.outputs.checksum_path }}
        run: |
          gh release create $env:GITHUB_REF_NAME $env:ZIP_PATH $env:CHECKSUM_PATH `
            --verify-tag `
            --title "Codex Quota Float $env:GITHUB_REF_NAME" `
            --generate-notes
