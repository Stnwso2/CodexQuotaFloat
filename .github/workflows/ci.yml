name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 9.0.x

      - name: Build with analyzers
        run: dotnet build --configuration Release /p:EnableNETAnalyzers=true /p:AnalysisLevel=latest /warnaserror

      - name: Verify self-contained publish
        run: dotnet publish --configuration Release --runtime win-x64 --self-contained true --no-restore --output publish
